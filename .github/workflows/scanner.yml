name: Daily API Scanner

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      # Fetches the specific 'test' branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 'test'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Required library for async requests
      - name: Install dependencies
        run: pip install httpx

      # Executes script from the 'test' branch location
      - name: Run Scan Script
        run: python .github/scripts/scanner.py

      # Pushes JSON changes directly back to the 'test' branch
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add lists/list_all.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: $(date +'%Y-%m-%d %H:%M')" && git push origin test)
