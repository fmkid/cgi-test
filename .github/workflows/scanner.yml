name: Daily API Scanner

on:
  schedule:
    - cron: '0 0,12 * * *'
  push:
    branches: [ "main", "test" ]
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 'test'

      # TEMPORARY STEP: Lists all files downloaded from the 'test' branch
      - name: List files in repository
        run: |
          echo "=== Root Folder ==="
          ls -la
          echo "=== .github Folder ==="
          ls -la .github || echo ".github not found"

      # Leave the rest of the steps exactly the same...
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Required library for async requests
      - name: Install dependencies
        run: pip install httpx

      # Executes script
      - name: Run Scan Script
        run: python scanner.py

      # Pushes JSON changes directly back to the 'test' branch
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add lists/list_all.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: $(date +'%Y-%m-%d %H:%M')" && git push origin test)
