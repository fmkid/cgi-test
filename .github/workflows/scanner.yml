name: Daily API Scanner & Geolocated Fetch

on:
  schedule:
    - cron: '0 0,12 * * *'
  push:
    branches: [ "main", "test" ]
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 'test'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Installed requests along with httpx to support the proxy script
      - name: Install dependencies
        run: pip install httpx requests

      # ================= PROCESS 1: GLOBAL SCANNER =================
      - name: Run Global Scan Script
        run: python scanner.py

      # ================= PROCESS 2: GEOLOCATED SCANNER =================
      - name: Run proxy script for Colombia
        run: python proxy.py co

      - name: Run proxy script for Spain
        run: python proxy.py es

      - name: Run proxy script for Canada
        run: python proxy.py ca

      - name: Run proxy script for United Kingdom
        run: python proxy.py gb

      - name: Run proxy script for USA natively
        run: python proxy.py us

      # ================= COMMIT ALL CHANGES =================
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add lists/list_all.json lists/list_*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated global and geolocated update: $(date +'%Y-%m-%d %H:%M')" && git push origin test)
