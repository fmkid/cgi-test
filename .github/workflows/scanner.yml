name: Daily API Scanner

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Installs the required async HTTP library
    - name: Install dependencies
      run: pip install httpx

    - name: Run Scan Script
      run: python .github/scanner/scanner.py

    # Commits and pushes the JSON file only if changes were detected
    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add lists/list_all.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: $(date +'%Y-%m-%d %H:%M')" && git push)
