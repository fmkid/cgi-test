name: Daily API Scanner & Geolocated Fetch

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ "main", "test" ]
  workflow_dispatch:

env:
  API_URL: ${{ vars.PTV_API_URL }}
  
jobs:
  # This initial job sets the single source of truth for the entire workflow
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.codes }}
    steps:
      - id: set-matrix
        # Edit your country codes array ONLY HERE (Using double quotes for valid JSON)
        run: echo 'codes=${{ vars.COUNTRY_LIST }}' >> $GITHUB_OUTPUT

  run-geolocated-fetch:
    needs: setup
    runs-on: ubuntu-latest
    env:
      PROXY_URL: ${{ vars.CDN_PROXY_API }}
    strategy:
      matrix:
        country_code: ${{ fromJson(needs.setup.outputs.matrix) }}
        exclude:
          - country_code: "any"
      fail-fast: false 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: 'test'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install "requests[socks]"

      - name: Run proxy script for ${{ matrix.country_code }}
        run: python scripts/proxy.py ${{ matrix.country_code }}

      - name: Commit country changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add lists/list_${{ matrix.country_code }}.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Automated geolocated update [${{ matrix.country_code }}]"
            for i in {1..5}; do
              git pull --rebase origin test && git push origin test && break || sleep 5
            done
          else
            echo "No changes detected"
          fi
  
  run-global-scanner:
    needs: [setup, run-geolocated-fetch]
    runs-on: ubuntu-latest
    env:
      # Passes the exact same single source string array to Python
      RAW_COUNTRY_CODES: ${{ needs.setup.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: 'test'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install httpx

      - name: Run Global Scan Script
        run: python scripts/scanner.py

      - name: Commit global changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add lists/list_all.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated global update: $(date +'%Y-%m-%d %H:%M')" && git push origin test)
